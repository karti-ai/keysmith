<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Keysmith architecture</title>
  <desc id="desc">A local read-only browser and agent flow through a loopback server, deterministic Rust planning core, USB Raw HID, and a physically gated QMK firmware. Normal typing remains a separate USB, Bluetooth, or 2.4 gigahertz plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111820"/></linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1fce8b"/><stop offset="1" stop-color="#3ae6aa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6a75"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2bd99b"/></marker>
  </defs>
  <rect width="1400" height="620" rx="24" fill="url(#bg)"/>
  <path d="M0 110H1400M0 394H1400" stroke="#26313a" stroke-width="1"/>
  <text x="48" y="54" fill="#f4f2ec" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700">Two planes. One physical boundary.</text>
  <text x="48" y="84" fill="#8f9aa5" font-family="Inter,Segoe UI,sans-serif" font-size="16">Keysmith keeps inspection convenient and every hardware write attended.</text>

  <text x="48" y="140" fill="#7f8b96" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">MANAGEMENT PLANE · USB ONLY</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(48 170)">
      <rect width="220" height="156" rx="14" fill="#161d24" stroke="#303b45"/>
      <circle cx="28" cy="31" r="8" fill="#2bd99b"/><text x="48" y="38" fill="#f4f2ec" font-size="18" font-weight="700">UI + agent</text>
      <rect x="18" y="58" width="88" height="24" rx="12" fill="#14382e"/><text x="62" y="75" text-anchor="middle" fill="#55e7b2" font-size="11" font-weight="700">READ-ONLY</text>
      <text x="18" y="109" fill="#9ca7b1" font-size="14">Inspect · stage · preview</text>
      <text x="18" y="134" fill="#697681" font-size="12">No apply or flash route</text>
    </g>
    <g transform="translate(319 170)">
      <rect width="220" height="156" rx="14" fill="#161d24" stroke="#303b45"/>
      <circle cx="28" cy="31" r="8" fill="#2bd99b"/><text x="48" y="38" fill="#f4f2ec" font-size="18" font-weight="700">Loopback server</text>
      <rect x="18" y="58" width="98" height="24" rx="12" fill="#1d2b35"/><text x="67" y="75" text-anchor="middle" fill="#b4c3cf" font-size="11" font-weight="700">SAME ORIGIN</text>
      <text x="18" y="109" fill="#9ca7b1" font-size="14">127.0.0.1 · serialized HID</text>
      <text x="18" y="134" fill="#697681" font-size="12">Private proxy optional</text>
    </g>
    <g transform="translate(590 170)">
      <rect width="220" height="156" rx="14" fill="#161d24" stroke="#303b45"/>
      <circle cx="28" cy="31" r="8" fill="#2bd99b"/><text x="48" y="38" fill="#f4f2ec" font-size="18" font-weight="700">Rust plan core</text>
      <rect x="18" y="58" width="116" height="24" rx="12" fill="#1d2b35"/><text x="76" y="75" text-anchor="middle" fill="#b4c3cf" font-size="11" font-weight="700">DETERMINISTIC</text>
      <text x="18" y="109" fill="#9ca7b1" font-size="14">Snapshot · diff · packet</text>
      <text x="18" y="134" fill="#697681" font-size="12">CLI is the attended edge</text>
    </g>
    <g transform="translate(861 170)">
      <rect width="220" height="156" rx="14" fill="#161d24" stroke="#303b45"/>
      <circle cx="28" cy="31" r="8" fill="#2bd99b"/><text x="48" y="38" fill="#f4f2ec" font-size="18" font-weight="700">USB Raw HID</text>
      <rect x="18" y="58" width="82" height="24" rx="12" fill="#1d2b35"/><text x="59" y="75" text-anchor="middle" fill="#b4c3cf" font-size="11" font-weight="700">LOCAL</text>
      <text x="18" y="109" fill="#9ca7b1" font-size="14">Usage FF60 / 61</text>
      <text x="18" y="134" fill="#697681" font-size="12">32-byte correlated packets</text>
    </g>
    <g transform="translate(1132 170)">
      <rect width="220" height="156" rx="14" fill="#1b1a1b" stroke="#d84a43" stroke-width="1.5"/>
      <circle cx="28" cy="31" r="8" fill="#d84a43"/><text x="48" y="38" fill="#f4f2ec" font-size="18" font-weight="700">QMK gate</text>
      <rect x="18" y="58" width="96" height="24" rx="12" fill="#431f22"/><text x="66" y="75" text-anchor="middle" fill="#ff8b84" font-size="11" font-weight="700">LOCKED</text>
      <text x="18" y="109" fill="#b8a6a5" font-size="14">Exact op · physical chord</text>
      <text x="18" y="134" fill="#806d6c" font-size="12">Apply once · verify · relock</text>
    </g>
  </g>

  <g stroke="#5d6a75" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M272 248H310"/><path d="M543 248H581"/><path d="M814 248H852"/><path d="M1085 248H1123"/>
  </g>
  <path d="M1242 143V164" stroke="#d84a43" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <rect x="1128" y="116" width="228" height="28" rx="14" fill="#2a1b1d" stroke="#5a292d"/>
  <text x="1242" y="135" text-anchor="middle" fill="#ff958e" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">ESC + SPACE + RIGHT CTRL · 3s</text>

  <text x="48" y="428" fill="#7f8b96" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">TYPING PLANE</text>
  <rect x="48" y="452" width="1304" height="94" rx="16" fill="#121920" stroke="#26313a"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="78" y="488" fill="#f4f2ec" font-size="17" font-weight="700">Normal keyboard reports</text>
    <text x="78" y="518" fill="#8996a1" font-size="14">USB · Bluetooth · 2.4 GHz</text>
    <path d="M320 498H1055" stroke="url(#safe)" stroke-width="3" marker-end="url(#greenArrow)"/>
    <text x="694" y="484" text-anchor="middle" fill="#54dfae" font-size="12" font-weight="700">KEYS · MEDIA · KNOB · LIGHTING SHORTCUTS</text>
    <text x="1090" y="488" fill="#f4f2ec" font-size="17" font-weight="700">Host OS</text>
    <text x="1090" y="518" fill="#8996a1" font-size="14">Typing never depends on Keysmith</text>
  </g>
  <rect x="48" y="570" width="1304" height="1" fill="#26313a"/>
  <text x="700" y="598" text-anchor="middle" fill="#7f8b96" font-family="Inter,Segoe UI,sans-serif" font-size="13">No web apply · no remote DFU · no Bluetooth management · no background mutation</text>
</svg>
